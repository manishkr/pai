[package]
name = "app"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]

[dependencies]
anyhow.workspace = true
gloo-net = "0.7.0"
js-sys = "0.3.94"
leptos = { version = "0.8.17", default-features = false }
leptos_meta = { version = "0.8.6", default-features = false }
leptos_router = { version = "0.8.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
shared = { path = "../shared" }
thiserror.workspace = true
urlencoding = "2.1.3"
uuid.workspace = true
wasm-bindgen = "0.2.117"
wasm-bindgen-futures = "0.4.67"
web-sys = { version = "0.3.94", features = ["Document", "Event", "EventSource", "HtmlInputElement", "HtmlTextAreaElement", "Location", "MessageEvent", "Window"] }
