[package]
name = "server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
app = { path = "../app", default-features = false, features = ["ssr"] }
axum = { version = "0.8.8", features = ["macros"] }
base64 = "0.22.1"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
cookie = "0.18.1"
diesel = { version = "2.3.7", features = ["postgres", "r2d2", "uuid"] }
diesel_migrations = { version = "2.3.1", features = ["postgres"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
hmac = "0.13.0"
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }
leptos_axum = "0.8.8"
leptos_meta = { version = "0.8.6", default-features = false, features = ["ssr"] }
leptos_router = { version = "0.8.13", default-features = false, features = ["ssr"] }
redis = "1.2.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "form", "stream", "rustls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2 = "0.11.0"
shared = { path = "../shared" }
thiserror.workspace = true
tokio = { version = "1.51.0", features = ["full"] }
tokio-stream = "0.1.18"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
urlencoding = "2.1.3"
uuid = { workspace = true, features = ["serde", "v4"] }
